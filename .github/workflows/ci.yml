name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-analyze-docker:
    name: Build, Test, Analyze and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn clean verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        run: mvn -B verify

      - name: Build Docker Image
        run: docker build -t user-service-app:${{ github.sha }} .

      - name: Save Docker Image as Tar Archive
        run: docker save user-service-app:${{ github.sha }} > user-service-app.tar

      - name: Upload Docker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: user-service-app.tar
          retention-days: 1